<div class="h-screen flex bg-slate-50 overflow-hidden">
  
  <!-- Mobile sidebar backdrop -->
  <div *ngIf="isSidebarOpen" (click)="toggleSidebar()" class="fixed inset-0 z-40 bg-slate-900/80 backdrop-blur-sm lg:hidden transition-opacity duration-300"></div>

  <!-- Sidebar -->
  <aside [class.translate-x-0]="isSidebarOpen" [class.-translate-x-full]="!isSidebarOpen" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white flex flex-col transition-transform duration-300 lg:static lg:translate-x-0 shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-slate-800 shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-lg shadow-sm">D</div>
        <h1 class="text-xl font-bold tracking-tight">DomiControl</h1>
      </div>
    </div>
    
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      <a routerLink="/dashboard" routerLinkActive="bg-slate-800 text-blue-400" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
        <span>📊</span> <span class="font-medium">Dashboard</span>
      </a>
      <a routerLink="/clients" routerLinkActive="bg-slate-800 text-blue-400" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
        <span>👥</span> <span class="font-medium">Clientes</span>
      </a>
      <a routerLink="/reports" routerLinkActive="bg-slate-800 text-blue-400" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">
        <span>📈</span> <span class="font-medium">Reportes</span>
      </a>
    </nav>
    
    <div class="p-4 border-t border-slate-800 shrink-0">
      <button (click)="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 hover:text-white transition-colors font-medium text-sm">
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
    <header class="bg-white shadow-sm z-10 lg:h-20 min-h-[4.5rem] flex items-center justify-between px-4 sm:px-6 lg:px-8 shrink-0">
      <div class="flex items-center gap-4 flex-1 min-w-0">
        <!-- Hamburger menu for mobile -->
        <button (click)="toggleSidebar()" class="p-2 -ml-2 text-slate-500 hover:text-slate-700 lg:hidden focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-600 rounded-md">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        
        <!-- Dynamic Page Titles -->
        <div class="truncate">
          <h1 class="text-xl sm:text-2xl font-bold leading-7 text-slate-900 truncate">{{ pageTitle }}</h1>
          <p *ngIf="pageSubtitle" class="mt-0.5 text-xs sm:text-sm text-slate-500 truncate hidden sm:block">{{ pageSubtitle }}</p>
        </div>
      </div>

      <div class="flex items-center gap-3 border-l border-slate-200 pl-4 ml-4 shrink-0 hidden sm:flex">
        <span class="text-sm font-medium text-slate-700">Administrador</span>
        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm">A</div>
      </div>
    </header>
    
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
