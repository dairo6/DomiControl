<div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-slate-100">
  <div class="mb-6 text-center">
    <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">DomiControl</h2>
    <p class="mt-2 text-sm text-slate-600">Ingresa a tu cuenta para continuar</p>
  </div>

  <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">Correo electrónico</label>
      <div class="mt-1">
        <input id="email" type="email" formControlName="email" class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="ejemplo@correo.com">
      </div>
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
      <div class="mt-1">
        <input id="password" type="password" formControlName="password" class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="••••••••">
      </div>
    </div>

    <div class="flex items-center justify-end">
      <div class="text-sm">
        <a routerLink="/forgot-password" class="font-medium text-blue-600 hover:text-blue-500">¿Olvidaste tu contraseña?</a>
      </div>
    </div>

    <!-- Mensaje de error -->
    @if (errorMessage) {
      <div class="rounded-md bg-red-50 p-4">
        <div class="flex">
          <div class="ml-3">
            <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
          </div>
        </div>
      </div>
    }

    <div>
      <button type="submit" [disabled]="loginForm.invalid || loading" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 transition-colors">
        {{ loading ? 'Iniciando...' : 'Iniciar Sesión' }}
      </button>
    </div>
  </form>

  <div class="mt-6 text-center">
    <p class="text-sm text-slate-600">
      ¿No tienes una cuenta?
      <a routerLink="/register" class="font-medium text-blue-600 hover:text-blue-500">Regístrate aquí</a>
    </p>
  </div>
</div>
